<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontick</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button id="filterToggleBtn" class="icon-button filter-button" title="展开 / 收起筛选">
          <svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 3h12L9.5 8v4.2l-3 1.4V8L2 3z"></path>
          </svg>
          <span id="filterCount" class="filter-count hidden">0</span>
        </button>
        <input id="searchInput" placeholder="搜索字体 / 拼音 / 字族 / PostScriptName" />
        <button id="refreshBtn" class="compact-button">刷新</button>
        <button id="settingsBtn" class="icon-button" title="设置">⚙</button>
      </header>

      <section id="filterPanel" class="filter-panel hidden">
        <div class="filter-group">
          <div class="filter-title">状态</div>
          <div class="filter-options">
            <button id="clearFiltersBtn" class="chip active">全部</button>
            <button data-filter="favorite" class="chip">收藏</button>
            <button data-filter="recent" class="chip">最近</button>
            <label class="inline-check">
              <input id="showHiddenInput" type="checkbox" />
              显示隐藏字体
            </label>
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-title">语言</div>
          <div id="languageFilters" class="filter-options"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">厂商</div>
          <div id="vendorFilters" class="filter-options"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">字重</div>
          <div id="weightFilters" class="filter-options"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">用户</div>
          <div id="userTagFilters" class="filter-options"></div>
        </div>
      </section>

      <section class="displaybar">
        <div id="fontDisplayControls" class="display-controls">
          <div class="segmented" id="previewModeBtns">
            <button data-preview-mode="name">名称</button>
            <button data-preview-mode="family">字族</button>
            <button data-preview-mode="custom">预览</button>
          </div>
          <input id="previewTextInput" class="preview-text hidden" placeholder="预览文字" />
          <label class="range-label">字号 <span id="previewSizeText">16</span></label>
          <input id="previewSizeInput" class="size-range" type="range" min="10" max="40" value="16" />
          <button id="toggleFamiliesBtn" class="icon-button" title="展开 / 折叠所有字族">⇅</button>
        </div>
        <div id="compositeDisplayControls" class="display-controls hidden">
          <button id="newCompositeBtn" type="button">＋ 新建复合字体</button>
        </div>
        <button id="alwaysOnTopBtn" class="icon-button pin-button" type="button" title="窗口置顶">📌</button>
      </section>

      <nav id="modeTabs" class="mode-tabs" aria-label="列表类型">
        <button id="fontTab" class="active" type="button">字体 <span id="fontTabCount">0</span></button>
        <button id="compositeTab" type="button">复合字体 <span id="compositeTabCount">0</span></button>
      </nav>

      <section id="fontPanel" class="content-panel">
        <main id="listViewport" class="list-viewport">
          <div id="listInner" class="list-inner"></div>
        </main>

        <section id="batchBar" class="batchbar hidden">
          <span id="batchCount">已选 0 个字体</span>
          <input id="batchTagInput" placeholder="标签名" />
          <button id="batchAddTagBtn">添加标签</button>
          <button id="batchRemoveTagBtn">移除标签</button>
          <button id="batchFavoriteBtn">收藏</button>
          <button id="batchUnfavoriteBtn">取消收藏</button>
          <button id="batchHideBtn">隐藏</button>
          <button id="batchUnhideBtn">取消隐藏</button>
        </section>

        <section id="detail" class="detail">
          <div class="empty">选择字体后显示详情</div>
        </section>
      </section>
      <section id="compositePanel" class="content-panel hidden">
        <div id="compositeList" class="composite-list"></div>
        <div id="compositeEmpty" class="empty-state hidden">尚未创建复合字体</div>
        <section id="compositeEditor" class="composite-editor hidden" aria-label="复合字体编辑器"></section>
        <section id="fontPicker" class="font-picker hidden" aria-label="选择字体"></section>
        <section id="unicodePicker" class="unicode-picker hidden" aria-label="添加 Unicode 分类"></section>
      </section>

      <footer id="status" class="status">准备就绪</footer>
    </div>

    <section id="settingsPanel" class="settings hidden">
      <div class="settings-card">
        <div class="settings-head">
          <strong>设置</strong>
          <button id="closeSettingsBtn">关闭</button>
        </div>
        <div class="settings-block">
          <div class="setting-row">
            <span>列表右侧显示</span>
            <div class="segmented" id="metaModeBtns">
              <button data-meta-mode="name">名称</button>
              <button data-meta-mode="ps">PSName</button>
              <button data-meta-mode="tags">标签</button>
            </div>
          </div>
        </div>
        <div class="settings-actions">
          <button id="syncThemeBtn">同步 Photoshop 主题</button>
        </div>
        <div class="settings-list">
          <h3>字体列表保存</h3>
          <div class="settings-actions">
            <button id="exportBtn">导出 JSON</button>
            <label class="file-button">
              导入 JSON
              <input id="importInput" type="file" accept="application/json,.json" />
            </label>
            <button id="cleanMissingBtn">清理缺失字体数据</button>
          </div>
          <h3>隐藏字体</h3>
          <div id="hiddenFontsList" class="small-list"></div>
          <h3>缺失字体数据</h3>
          <div id="missingFontsList" class="small-list"></div>
          <h3>关于</h3>
          <div class="about-box">
            <div>Fontick</div>
            <div>作者：暴二羊</div>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
