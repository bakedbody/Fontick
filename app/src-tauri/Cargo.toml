[package]
name = "fontick"
version = "1.3.2"
description = "Small Photoshop font picker"
authors = ["暴二羊"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.0", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSObject", "NSString"] }
tao = { version = "=0.35.3", features = ["fontick-nonactivating-panel"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[patch.crates-io]
tao = { git = "https://github.com/bakedbody/tao.git", rev = "ff0c2dd24e093e60a3cfd2e7f416219c41bfc508" }
